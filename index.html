<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Mis marcadores</title>
<meta name="theme-color" content="#F3EEE3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marcadores">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Kaushan+Script&family=Source+Serif+4:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#F3EEE3;
    --card:#FFFDF7;
    --ink:#1F2A44;
    --ink-soft:#3C4A6B;
    --brass:#B08D57;
    --brass-dark:#8C6E3F;
    --muted:#8A8371;
    --line:#D9D0BC;
    --danger:#A8442E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,42,68,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Source Serif 4', serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));position:relative;}

  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:8px;
  }
  .drawer-label{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brass-dark);font-family:'JetBrains Mono',monospace;
    margin:0 0 4px;
  }
  h1{
    font-family:'Kaushan Script', cursive;
    font-weight:400;
    font-size:44px;
    letter-spacing:0;
    margin:0;
    line-height:1.05;
    color:var(--ink);
  }
  .menu-btn{
    background:none;border:none;cursor:pointer;
    color:var(--ink);padding:6px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .menu-btn:hover, .menu-btn:focus-visible{background:rgba(31,42,68,.08);outline:none;}
  .menu-btn svg{width:26px;height:26px;}

  .catalog-note{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--muted);
    margin:0 0 26px;
  }

  #list{list-style:none;margin:0;padding:0;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--brass);
    border-radius:3px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(31,42,68,.06);
    transition:box-shadow .15s ease, transform .12s ease;
  }
  .card:active{transform:scale(.99);box-shadow:0 1px 1px rgba(31,42,68,.05);}

  .card a{
    display:flex;align-items:center;
    padding:16px 18px;
    text-decoration:none;color:var(--ink);
    min-width:0;
  }
  .card a .name{
    font-family:'Fraunces', serif;
    font-weight:600;font-size:18px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:13px;
    border:1px dashed var(--line);border-radius:4px;
  }
  .empty strong{display:block;font-family:'Fraunces',serif;font-size:20px;color:var(--ink);font-weight:600;margin-bottom:8px;}

  /* Settings panel */
  .overlay{
    position:fixed;inset:0;background:rgba(31,42,68,.35);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    z-index:10;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .panel{
    position:fixed;top:0;right:0;height:100%;width:min(380px,88vw);
    background:var(--paper);
    border-left:2px solid var(--ink);
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:11;
    display:flex;flex-direction:column;
    padding:22px 20px;
  }
  .panel.open{transform:translateX(0);}
  .panel h2{
    font-family:'Fraunces',serif;font-size:24px;font-weight:700;
    margin:0 0 4px;
  }
  .panel .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin:0 0 20px;text-transform:uppercase;letter-spacing:.1em;}
  .close-btn{
    position:absolute;top:20px;right:16px;background:none;border:none;
    cursor:pointer;color:var(--ink);padding:4px;
  }
  .close-btn svg{width:22px;height:22px;}

  label{
    display:block;font-family:'JetBrains Mono',monospace;
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);margin:14px 0 5px;
  }
  input[type=text], input[type=url]{
    width:100%;padding:10px 11px;
    border:1px solid var(--line);border-radius:3px;
    background:var(--card);color:var(--ink);
    font-family:'Source Serif 4',serif;font-size:15px;
  }
  input:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}

  .add-btn{
    margin-top:16px;width:100%;padding:11px;
    background:var(--ink);color:var(--paper);border:none;border-radius:3px;
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;transition:background .15s ease;
  }
  .add-btn:hover{background:var(--ink-soft);}

  .panel-list{margin-top:24px;overflow-y:auto;flex:1;border-top:1px solid var(--line);padding-top:10px;position:relative;}

  .panel-list-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:26px;
  }
  .edit-toggle{
    background:none;border:1px solid var(--line);border-radius:5px;
    cursor:pointer;padding:6px 8px;color:var(--ink-soft);
    display:flex;align-items:center;gap:5px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .edit-toggle svg{width:14px;height:14px;}
  .edit-toggle.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .panel-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 2px;border-bottom:1px solid var(--line);
    gap:8px;
  }
  .panel-item .phandle{
    display:none;
    flex:0 0 26px;color:var(--muted);cursor:grab;
    align-items:center;justify-content:center;
  }
  .panel-item.edit-mode .phandle{display:flex;}
  .panel-item.edit-mode .info{cursor:pointer;}
  .panel-item.dragging{
    opacity:1;position:absolute;left:0;right:0;z-index:50;
    background:var(--card);box-shadow:0 8px 18px rgba(31,42,68,.18);
    border-radius:3px;
  }
  .panel-item.placeholder{border:1px dashed var(--brass);background:transparent;}
  .phandle svg{width:15px;height:15px;}

  .panel-item .info{min-width:0;flex:1;}
  .panel-item .pname{font-family:'Fraunces',serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .panel-item .purl{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .del-btn{
    background:none;border:none;cursor:pointer;color:var(--danger);
    padding:6px;flex:0 0 auto;
  }
  .del-btn svg{width:16px;height:16px;}

  .edit-row{padding:10px 2px;border-bottom:1px solid var(--line);}
  .edit-row label{margin:8px 0 4px;}
  .edit-row .edit-actions{display:flex;gap:8px;margin-top:12px;}
  .edit-row .edit-actions button{
    flex:1;padding:9px;border-radius:3px;border:none;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  }
  .save-edit{background:var(--ink);color:var(--paper);}
  .save-edit:hover{background:var(--ink-soft);}
  .cancel-edit{background:transparent;color:var(--ink-soft);border:1px solid var(--line) !important;}

  .hint{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:22px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="drawer-label">Catálogo · A&nbsp;&ndash;&nbsp;Z</p>
      <h1>Mis marcadores</h1>
    </div>
    <button class="menu-btn" id="openPanel" aria-label="Abrir ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>
  <p class="catalog-note" id="countLabel">cargando ficha…</p>

  <ul id="list"></ul>
  <div class="empty" id="emptyState" style="display:none;">
    <strong>La ficha está vacía</strong>
    Añade tu primer marcador desde el menú ⋮ de arriba
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel" role="dialog" aria-label="Ajustes de marcadores">
  <button class="close-btn" id="closePanel" aria-label="Cerrar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <h2>Ajustes</h2>
  <p class="sub">Añadir marcador</p>
  <form id="addForm">
    <label for="fname">Nombre a mostrar</label>
    <input type="text" id="fname" placeholder="p. ej. Correo" required maxlength="60">
    <label for="furl">Enlace</label>
    <input type="url" id="furl" placeholder="https://..." required>
    <button type="submit" class="add-btn">Añadir marcador</button>
  </form>

  <div class="panel-list-head">
    <p class="sub" style="margin:0;">Marcadores guardados</p>
    <button class="edit-toggle" id="editToggle" type="button" aria-label="Modificar marcadores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 0 1 4 4L7 21l-4 1 1-4Z"/></svg>
      Editar
    </button>
  </div>
  <div class="panel-list" id="panelList"></div>

  <p class="hint" id="panelHint">Pulsa «Editar» para reordenar arrastrando o para tocar un marcador y cambiar su nombre o enlace.</p>
</div>

<script>
// --- Configura aquí tu proyecto de Supabase ---
const SUPABASE_URL = 'https://izmtpbdmtzhjpwxzgicr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pJMwZanGBMBygA1cZNSK0A_ykxSZglE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let bookmarks = [];

async function loadBookmarks(){
  const countLabel = document.getElementById('countLabel');
  countLabel.textContent = 'cargando ficha…';
  const { data, error } = await sb
    .from('bookmarks')
    .select('*')
    .order('position', { ascending: true });
  if(error){
    console.error(error);
    countLabel.textContent = 'no se pudo conectar con el catálogo';
    return;
  }
  bookmarks = data.map(row => ({ id: row.id, name: row.name, url: row.url, position: row.position }));
  render();
}

async function addBookmark(name, url){
  const nextPos = bookmarks.length ? Math.max(...bookmarks.map(b=>b.position)) + 1 : 0;
  const { data, error } = await sb
    .from('bookmarks')
    .insert({ name, url, position: nextPos })
    .select()
    .single();
  if(error){ console.error(error); return; }
  bookmarks.push({ id: data.id, name: data.name, url: data.url, position: data.position });
  render();
}

async function deleteBookmark(id){
  const { error } = await sb.from('bookmarks').delete().eq('id', id);
  if(error){ console.error(error); return; }
  bookmarks = bookmarks.filter(b => b.id !== id);
  render();
}

async function updateBookmark(id, name, url){
  const { error } = await sb.from('bookmarks').update({ name, url }).eq('id', id);
  if(error){ console.error(error); return; }
  const b = bookmarks.find(x => x.id === id);
  if(b){ b.name = name; b.url = url; }
}

async function persistOrder(){
  // Actualiza el campo "position" de cada marcador según el nuevo orden
  const updates = bookmarks.map((b, i) => ({ id: b.id, position: i }));
  bookmarks.forEach((b, i) => b.position = i);
  await Promise.all(updates.map(u =>
    sb.from('bookmarks').update({ position: u.position }).eq('id', u.id)
  ));
}

function hostFromUrl(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; }
}

function render(){
  const list = document.getElementById('list');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('countLabel');
  list.innerHTML = '';
  count.textContent = bookmarks.length === 0 ? 'sin fichas registradas · sincronizado' :
    bookmarks.length + (bookmarks.length === 1 ? ' ficha registrada · sincronizado' : ' fichas registradas · sincronizado');
  empty.style.display = bookmarks.length === 0 ? 'block' : 'none';

  bookmarks.forEach(b => {
    const li = document.createElement('li');
    li.className = 'card';
    li.dataset.id = b.id;
    li.innerHTML = `
      <a href="${b.url}" target="_blank" rel="noopener noreferrer">
        <span class="name">${escapeHtml(b.name)}</span>
      </a>`;
    list.appendChild(li);
  });

  renderPanelList();
}

let editMode = false;
let editingId = null;

function renderPanelList(){
  const panelList = document.getElementById('panelList');
  const hint = document.getElementById('panelHint');
  panelList.innerHTML = '';

  if(bookmarks.length === 0){
    panelList.innerHTML = '<p class="hint" style="margin-top:6px;">Todavía no hay marcadores guardados.</p>';
    return;
  }

  hint.style.display = editMode ? 'block' : 'none';

  bookmarks.forEach(b => {
    if(editingId === b.id){
      const row = document.createElement('div');
      row.className = 'edit-row';
      row.dataset.id = b.id;
      row.innerHTML = `
        <label>Nombre a mostrar</label>
        <input type="text" class="edit-name" value="${escapeHtml(b.name)}" maxlength="60">
        <label>Enlace</label>
        <input type="url" class="edit-url" value="${escapeHtml(b.url)}">
        <div class="edit-actions">
          <button type="button" class="cancel-edit">Cancelar</button>
          <button type="button" class="save-edit">Guardar</button>
        </div>`;
      panelList.appendChild(row);
      row.querySelector('.cancel-edit').addEventListener('click', ()=>{
        editingId = null; renderPanelList();
      });
      row.querySelector('.save-edit').addEventListener('click', async ()=>{
        const newName = row.querySelector('.edit-name').value.trim();
        let newUrl = row.querySelector('.edit-url').value.trim();
        if(!newName || !newUrl) return;
        if(!/^https?:\/\//i.test(newUrl)) newUrl = 'https://' + newUrl;
        await updateBookmark(b.id, newName, newUrl);
        editingId = null;
        render();
      });
      return;
    }

    const row = document.createElement('div');
    row.className = 'panel-item' + (editMode ? ' edit-mode' : '');
    row.dataset.id = b.id;
    row.innerHTML = `
      <div class="phandle" aria-label="Arrastrar para reordenar">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
      </div>
      <div class="info">
        <div class="pname">${escapeHtml(b.name)}</div>
        <div class="purl">${escapeHtml(b.url)}</div>
      </div>
      <button class="del-btn" data-id="${b.id}" aria-label="Eliminar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13"/></svg>
      </button>`;
    panelList.appendChild(row);

    row.querySelector('.del-btn').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      deleteBookmark(b.id);
    });

    if(editMode){
      row.querySelector('.info').addEventListener('click', ()=>{
        editingId = b.id;
        renderPanelList();
      });
      attachPanelDrag(row);
    }
  });
}

document.getElementById('editToggle').addEventListener('click', ()=>{
  editMode = !editMode;
  editingId = null;
  document.getElementById('editToggle').classList.toggle('active', editMode);
  renderPanelList();
});

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Panel open/close ---
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
document.getElementById('openPanel').addEventListener('click', ()=>{
  overlay.classList.add('open');
  panel.classList.add('open');
});
function closePanel(){
  overlay.classList.remove('open');
  panel.classList.remove('open');
}
document.getElementById('closePanel').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);

// --- Add form ---
document.getElementById('addForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const nameInput = document.getElementById('fname');
  const urlInput = document.getElementById('furl');
  const submitBtn = e.target.querySelector('.add-btn');
  let url = urlInput.value.trim();
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Añadiendo…';
  await addBookmark(nameInput.value.trim(), url);
  submitBtn.disabled = false;
  submitBtn.textContent = 'Añadir marcador';
  nameInput.value = '';
  urlInput.value = '';
  nameInput.focus();
});

// --- Drag to reorder inside the settings panel (pointer events, touch + mouse) ---
let dragEl = null, placeholder = null, offsetY = 0, rowHeight = 0;

function attachPanelDrag(row){
  const handle = row.querySelector('.phandle');
  handle.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const list = document.getElementById('panelList');
    const listRect = list.getBoundingClientRect();
    const rowRect = row.getBoundingClientRect();

    dragEl = row;
    offsetY = e.clientY - rowRect.top;
    rowHeight = rowRect.height;

    placeholder = document.createElement('div');
    placeholder.className = 'panel-item placeholder';
    placeholder.style.height = rowHeight + 'px';
    list.insertBefore(placeholder, row);

    row.classList.add('dragging');
    row.style.top = (rowRect.top - listRect.top + list.scrollTop) + 'px';
    row.style.height = rowHeight + 'px';
    list.appendChild(row);

    document.body.style.userSelect = 'none';
    handle.setPointerCapture(e.pointerId);
    handle.addEventListener('pointermove', onPanelMove);
    handle.addEventListener('pointerup', onPanelUp);
    handle.addEventListener('pointercancel', onPanelUp);
  });
}

function onPanelMove(e){
  if(!dragEl) return;
  const list = document.getElementById('panelList');
  const listRect = list.getBoundingClientRect();
  const top = e.clientY - listRect.top - offsetY + list.scrollTop;
  dragEl.style.top = top + 'px';

  const dragMid = top + rowHeight/2;
  const rows = [...list.querySelectorAll('.panel-item:not(.dragging)')];
  let placed = false;
  for(const r of rows){
    if(r === placeholder) continue;
    const rMid = r.offsetTop + r.offsetHeight/2;
    if(dragMid < rMid){
      list.insertBefore(placeholder, r);
      placed = true;
      break;
    }
  }
  if(!placed){
    list.appendChild(placeholder);
  }

  // Auto-scroll the panel when dragging near its edges
  const margin = 40;
  if(e.clientY - listRect.top < margin) list.scrollTop -= 12;
  else if(listRect.bottom - e.clientY < margin) list.scrollTop += 12;
}

function onPanelUp(e){
  if(!dragEl) return;
  const handle = dragEl.querySelector('.phandle');
  handle.removeEventListener('pointermove', onPanelMove);
  handle.removeEventListener('pointerup', onPanelUp);
  handle.removeEventListener('pointercancel', onPanelUp);

  dragEl.classList.remove('dragging');
  dragEl.style.top = '';
  dragEl.style.height = '';
  placeholder.parentNode.insertBefore(dragEl, placeholder);
  placeholder.remove();
  document.body.style.userSelect = '';

  const ids = [...document.getElementById('panelList').querySelectorAll('.panel-item')].map(r => r.dataset.id);
  bookmarks.sort((a,b)=> ids.indexOf(a.id) - ids.indexOf(b.id));
  persistOrder();
  render();
  dragEl = null; placeholder = null;
}

loadBookmarks();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
